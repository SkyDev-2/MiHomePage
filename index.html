<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mi HomePage</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- =====================================
         FONDOS DE VIDEO
    ====================================== -->

    <video
        id="backgroundVideo"
        class="background-video"
        autoplay
        muted
        loop
        playsinline
    >
        <source
            id="videoSource"
            src="assets/backgrounds/lofi-room.mp4"
            type="video/mp4"
        >
    </video>


    <!-- Oscurece ligeramente el video -->

    <div class="video-overlay"></div>


    <!-- =====================================
         CONTENIDO PRINCIPAL
    ====================================== -->

    <main class="container">


        <!-- BOTÓN DE CONFIGURACIÓN -->

        <button
            id="settingsButton"
            class="settings-button"
            title="Configuración"
        >
            ⚙
        </button>


        <!-- =================================
             RELOJ
        ================================== -->

        <div id="clock">
            00:00
        </div>


        <div id="date">
            Cargando fecha...
        </div>


        <!-- =================================
             BUSCADOR
        ================================== -->

        <form
            class="search-box"
            action="https://www.google.com/search"
            method="GET"
        >

            <span class="search-icon">
                🔍
            </span>


            <input
                type="text"
                name="q"
                placeholder="Buscar en Google..."
                autocomplete="off"
            >

        </form>


        <!-- =================================
             ACCESOS DIRECTOS
        ================================== -->

        <section class="shortcuts">


            <!-- GITHUB -->

            <a
                class="shortcut"
                href="https://github.com"
                target="_blank"
            >

                <div class="shortcut-icon">

                    <img
                        src="assets/icons/github.png"
                        alt="GitHub"
                    >

                </div>

                <span>
                    GitHub
                </span>

            </a>


            <!-- YOUTUBE -->

            <a
                class="shortcut"
                href="https://youtube.com"
                target="_blank"
            >

                <div class="shortcut-icon">

                    <img
                        src="assets/icons/youtube.png"
                        alt="YouTube"
                    >

                </div>

                <span>
                    YouTube
                </span>

            </a>


            <!-- DISCORD -->

            <a
                class="shortcut"
                href="https://discord.com"
                target="_blank"
            >

                <div class="shortcut-icon">

                    <img
                        src="assets/icons/discord.png"
                        alt="Discord"
                    >

                </div>

                <span>
                    Discord
                </span>

            </a>


            <!-- TWITCH -->

            <a
                class="shortcut"
                href="https://twitch.tv"
                target="_blank"
            >

                <div class="shortcut-icon">

                    <img
                        src="assets/icons/twitch.png"
                        alt="Twitch"
                    >

                </div>

                <span>
                    Twitch
                </span>

            </a>


            <!-- GMAIL -->

            <a
                class="shortcut"
                href="https://gmail.com"
                target="_blank"
            >

                <div class="shortcut-icon">

                    <img
                        src="assets/icons/gmail.png"
                        alt="Gmail"
                    >

                </div>

                <span>
                    Gmail
                </span>

            </a>


        </section>

    </main>


    <!-- =====================================
         PANEL DE CONFIGURACIÓN
    ====================================== -->

    <aside
        id="settingsPanel"
        class="settings-panel"
    >


        <div class="settings-header">

            <h2>
                ⚙ Configuración
            </h2>

            <button
                id="closeSettings"
                class="close-button"
            >
                ×
            </button>

        </div>


        <!-- =================================
             FONDOS
        ================================== -->

        <div class="setting-group">

            <h3>
                Fondo
            </h3>


            <label class="radio-option">

                <input
                    type="radio"
                    name="background"
                    value="cat-rain.mp4"
                    checked
                >

                <span>
                    Cat on a Rainy Day
                </span>

            </label>


            <label class="radio-option">

                <input
                    type="radio"
                    name="background"
                    value="cat-sky.mp4"
                >

                <span>
                    Cat on a Cloudy Day
                </span>

            </label>


            <label class="radio-option">

                <input
                    type="radio"
                    name="background"
                    value="cat-train.mp4"
                >

                <span>
                    Cat on a Train
                </span>

            </label>

        </div>


        <!-- =================================
             MÚSICA
        ================================== -->

        <div class="setting-group">

            <h3>
                Música
            </h3>


            <div class="music-controls">

                <button
                    id="musicButton"
                    class="music-button"
                >
                    🔇
                </button>


                <input
                    id="volumeControl"
                    type="range"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0.4"
                >

            </div>

        </div>


        <!-- =================================
             TEMAS
        ================================== -->

        <div class="setting-group">

            <h3>
                Tema
            </h3>


            <label class="radio-option">

                <input
                    type="radio"
                    name="theme"
                    value="blue"
                    checked
                >

                <span>
                    🔵 Azul
                </span>

            </label>


            <label class="radio-option">

                <input
                    type="radio"
                    name="theme"
                    value="purple"
                >

                <span>
                    🟣 Morado
                </span>

            </label>


            <label class="radio-option">

                <input
                    type="radio"
                    name="theme"
                    value="green"
                >

                <span>
                    🟢 Verde
                </span>

            </label>

        </div>


    </aside>


    <!-- =====================================
         REPRODUCTOR DE MÚSICA
    ====================================== -->

    <audio
        id="music"
        loop
    >

        <source
            src="assets/music/lofi.mp3"
            type="audio/mpeg"
        >

    </audio>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
